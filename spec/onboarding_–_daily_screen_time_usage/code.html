<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Screendiet Onboarding</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                        "card-dark": "#16261b",
                        "surface-dark": "#1c2e23",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-slate-900 dark:text-white transition-colors duration-300">
<div class="relative flex h-full min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-background-light dark:bg-background-dark">
<div class="flex w-full items-center justify-between px-6 pt-8 pb-2">
<button class="p-2 -ml-2 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors group">
<span class="material-symbols-outlined text-slate-600 dark:text-gray-400 group-hover:text-primary transition-colors">arrow_back</span>
</button>
<button class="text-sm font-bold text-slate-400 dark:text-white/40 hover:text-primary transition-colors">Skip</button>
</div>
<div class="flex flex-col px-6 pt-4 pb-6">
<h1 class="text-slate-900 dark:text-white tracking-tight text-[32px] font-extrabold leading-tight text-left mb-3">
                Daily Screen Time
            </h1>
<p class="text-slate-500 dark:text-gray-400 text-lg font-medium leading-relaxed">
                Honestly, how much time do you spend staring at screens each day?
            </p>
</div>
<div class="flex-1 flex flex-col gap-4 px-6 overflow-y-auto no-scrollbar pb-24">
<label class="group relative cursor-pointer w-full">
<input class="peer sr-only" name="screen_time" type="radio" value="casual"/>
<div class="relative w-full rounded-3xl bg-white dark:bg-card-dark border-2 border-transparent p-6 transition-all duration-300 peer-checked:border-primary peer-checked:bg-surface-dark/80 peer-checked:shadow-[0_4px_20px_-4px_rgba(19,236,91,0.15)] hover:bg-slate-50 dark:hover:bg-surface-dark/50">
<div class="flex items-start gap-4">
<div class="mt-1 flex h-6 w-6 shrink-0 items-center justify-center rounded-full border-2 border-slate-300 dark:border-gray-600 bg-transparent transition-all peer-checked:border-primary peer-checked:bg-primary">
<span class="material-symbols-outlined text-[14px] font-bold text-background-dark opacity-0 peer-checked:opacity-100">check</span>
</div>
<div class="flex flex-col gap-1">
<span class="text-lg font-bold text-slate-900 dark:text-white">I'm a casual user</span>
<span class="text-base text-slate-500 dark:text-gray-400 leading-relaxed">Less than 2 hours. Mostly just checking messages occasionally.</span>
</div>
</div>
</div>
</label>
<label class="group relative cursor-pointer w-full">
<input class="peer sr-only" name="screen_time" type="radio" value="moderate"/>
<div class="relative w-full rounded-3xl bg-white dark:bg-card-dark border-2 border-transparent p-6 transition-all duration-300 peer-checked:border-primary peer-checked:bg-surface-dark/80 peer-checked:shadow-[0_4px_20px_-4px_rgba(19,236,91,0.15)] hover:bg-slate-50 dark:hover:bg-surface-dark/50">
<div class="flex items-start gap-4">
<div class="mt-1 flex h-6 w-6 shrink-0 items-center justify-center rounded-full border-2 border-slate-300 dark:border-gray-600 bg-transparent transition-all peer-checked:border-primary peer-checked:bg-primary">
<span class="material-symbols-outlined text-[14px] font-bold text-background-dark opacity-0 peer-checked:opacity-100">check</span>
</div>
<div class="flex flex-col gap-1">
<span class="text-lg font-bold text-slate-900 dark:text-white">I'm moderately active</span>
<span class="text-base text-slate-500 dark:text-gray-400 leading-relaxed">2 to 4 hours. Social media, news, and some videos.</span>
</div>
</div>
</div>
</label>
<label class="group relative cursor-pointer w-full">
<input checked="" class="peer sr-only" name="screen_time" type="radio" value="heavy"/>
<div class="relative w-full rounded-3xl bg-white dark:bg-card-dark border-2 border-transparent p-6 transition-all duration-300 peer-checked:border-primary peer-checked:bg-surface-dark/80 peer-checked:shadow-[0_4px_20px_-4px_rgba(19,236,91,0.15)] hover:bg-slate-50 dark:hover:bg-surface-dark/50">
<div class="flex items-start gap-4">
<div class="mt-1 flex h-6 w-6 shrink-0 items-center justify-center rounded-full border-2 border-slate-300 dark:border-gray-600 bg-transparent transition-all peer-checked:border-primary peer-checked:bg-primary">
<span class="material-symbols-outlined text-[14px] font-bold text-background-dark opacity-0 peer-checked:opacity-100">check</span>
</div>
<div class="flex flex-col gap-1">
<span class="text-lg font-bold text-slate-900 dark:text-white">I'm glued to it</span>
<span class="text-base text-slate-500 dark:text-gray-400 leading-relaxed">4 to 6 hours. It's my primary source of entertainment and work.</span>
</div>
</div>
</div>
</label>
<label class="group relative cursor-pointer w-full">
<input class="peer sr-only" name="screen_time" type="radio" value="extreme"/>
<div class="relative w-full rounded-3xl bg-white dark:bg-card-dark border-2 border-transparent p-6 transition-all duration-300 peer-checked:border-primary peer-checked:bg-surface-dark/80 peer-checked:shadow-[0_4px_20px_-4px_rgba(19,236,91,0.15)] hover:bg-slate-50 dark:hover:bg-surface-dark/50">
<div class="flex items-start gap-4">
<div class="mt-1 flex h-6 w-6 shrink-0 items-center justify-center rounded-full border-2 border-slate-300 dark:border-gray-600 bg-transparent transition-all peer-checked:border-primary peer-checked:bg-primary">
<span class="material-symbols-outlined text-[14px] font-bold text-background-dark opacity-0 peer-checked:opacity-100">check</span>
</div>
<div class="flex flex-col gap-1">
<span class="text-lg font-bold text-slate-900 dark:text-white">I live online</span>
<span class="text-base text-slate-500 dark:text-gray-400 leading-relaxed">6+ hours. I feel lost without my phone in my hand.</span>
</div>
</div>
</div>
</label>
</div>
<div class="fixed bottom-0 left-0 right-0 w-full max-w-md mx-auto bg-gradient-to-t from-background-light via-background-light to-transparent dark:from-background-dark dark:via-background-dark dark:to-transparent pt-12 pb-8 px-6 pointer-events-none">
<button class="pointer-events-auto group relative flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-full bg-primary h-14 px-5 text-background-dark text-lg font-bold leading-normal tracking-wide transition-all active:scale-[0.98] shadow-[0_0_20px_rgba(19,236,91,0.3)] hover:shadow-[0_0_30px_rgba(19,236,91,0.5)]">
<span class="relative z-10">Continue</span>
<div class="absolute inset-0 z-0 bg-white/20 opacity-0 transition-opacity group-hover:opacity-100"></div>
</button>
</div>
</div>

</body></html>
