<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Screendiet Welcome</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body>
<div class="relative flex h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-hidden font-display">
<!-- Background Gradient Effects -->
<div class="absolute top-[-20%] right-[-10%] w-[300px] h-[300px] bg-primary/20 rounded-full blur-[100px] pointer-events-none"></div>
<div class="absolute bottom-[-10%] left-[-20%] w-[250px] h-[250px] bg-primary/10 rounded-full blur-[80px] pointer-events-none"></div>
<!-- Main Content Wrapper -->
<div class="flex-1 flex flex-col justify-center items-center w-full max-w-md mx-auto px-6 z-10">
<!-- Hero Image / Logo Area -->
<div class="@container w-full mb-8">
<div class="flex justify-center">
<div class="w-full max-w-[320px] aspect-square bg-center bg-no-repeat bg-cover flex flex-col justify-end overflow-hidden rounded-3xl shadow-2xl shadow-primary/10" data-alt="Abstract calming digital landscape with glowing green elements" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDV1W_gCw6eRfjQvK_MKN5bKzhe5vub1eOIQjxD0wlbj94yvyO8IxuqnTOciItbPUNLPFuMIMX8JGQhPwH41fd8pyNWLWP3njkl0hmZo3EpGQLoXV6wcLtJbM_IF_dYsDD9IRitpbnG6NFTW9nktfKpdaxChO2toRlCQrMEdXkBnntgxP8P9BuDF_Dy7moxVEKAreMHx1EQmukDH9j7fWGHNzLBs1IgGDd-5zWonE-TRVA0jN9l1b_vqWRwapj94w1Ni6jOmlBLLdI");'>
<!-- Overlay gradient for better text integration if needed later, kept subtle here -->
<div class="w-full h-full bg-gradient-to-t from-background-dark/80 via-transparent to-transparent"></div>
</div>
</div>
</div>
<!-- Text Content -->
<div class="w-full flex flex-col items-center mb-10">
<h1 class="text-gray-900 dark:text-white tracking-tight text-[40px] font-extrabold leading-none text-center pb-4 pt-2">
                    Screendiet
                </h1>
<p class="text-gray-600 dark:text-gray-300 text-lg font-medium leading-relaxed text-center max-w-[300px]">
                    Reclaim your time. Master your focus. Digital fasting for a clearer mind.
                </p>
</div>
</div>
<!-- Footer / Actions -->
<div class="w-full max-w-md mx-auto px-6 pb-12 z-10">
<div class="flex flex-col gap-4">
<!-- Primary Button -->
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary hover:bg-primary/90 transition-colors text-background-dark text-lg font-bold leading-normal tracking-[0.015em] shadow-lg shadow-primary/25 active:scale-[0.98] transform transition-transform">
<span class="truncate">Get Started</span>
<span class="material-symbols-outlined ml-2 text-[20px] font-bold">arrow_forward</span>
</button>
<!-- Secondary Button -->
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-12 px-4 bg-transparent hover:bg-gray-100 dark:hover:bg-white/5 transition-colors text-gray-500 dark:text-gray-400 text-sm font-semibold leading-normal tracking-[0.015em]">
<span class="truncate">Already have an account? Log in</span>
</button>
</div>
</div>
</div>
</body></html>
