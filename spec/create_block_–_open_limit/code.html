<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Block – Open Limit</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Theme Configuration -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white antialiased min-h-screen flex flex-col overflow-x-hidden selection:bg-primary selection:text-background-dark">
<!-- Top Navigation -->
<header class="sticky top-0 z-50 flex items-center justify-between px-4 py-3 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md">
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
</button>
<h1 class="text-lg font-bold tracking-tight">Open Limit</h1>
<div class="w-10"></div> <!-- Spacer for alignment -->
</header>
<!-- Main Content -->
<main class="flex-1 flex flex-col w-full max-w-md mx-auto px-5 pb-32">
<!-- Headline Section -->
<div class="mt-4 mb-8 text-center">
<h2 class="text-2xl font-bold mb-2">Set Open Limit</h2>
<p class="text-slate-500 dark:text-gray-400 text-sm font-medium leading-relaxed">
                How many times can you open these apps today?
            </p>
</div>
<!-- Counter Section -->
<div class="flex flex-col items-center justify-center mb-10">
<div class="flex items-center gap-8 mb-3">
<!-- Decrease Button -->
<button class="group flex items-center justify-center w-14 h-14 rounded-full border-2 border-slate-200 dark:border-white/20 active:scale-95 transition-all hover:border-primary dark:hover:border-primary">
<span class="material-symbols-outlined text-2xl text-slate-400 group-hover:text-primary transition-colors">remove</span>
</button>
<!-- Count Display -->
<div class="relative w-24 text-center">
<span class="text-6xl font-extrabold text-slate-900 dark:text-white tracking-tighter">5</span>
<div class="absolute -right-2 top-0 w-2 h-2 rounded-full bg-primary animate-pulse"></div>
</div>
<!-- Increase Button -->
<button class="flex items-center justify-center w-14 h-14 rounded-full bg-primary text-background-dark shadow-[0_0_15px_rgba(19,236,91,0.3)] active:scale-95 transition-all hover:bg-primary/90">
<span class="material-symbols-outlined text-3xl font-bold">add</span>
</button>
</div>
<span class="text-xs font-bold tracking-widest uppercase text-slate-400 dark:text-white/40">Opens / Day</span>
</div>
<!-- App Selection Summary -->
<div class="mb-8">
<button class="w-full flex items-center justify-between bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 p-4 rounded-xl active:bg-slate-50 dark:active:bg-white/10 transition-colors">
<div class="flex items-center gap-3">
<div class="flex -space-x-2">
<!-- App Icon 1 -->
<div class="w-8 h-8 rounded-full border-2 border-white dark:border-[#1c2e22] bg-gradient-to-tr from-purple-500 to-pink-500 overflow-hidden flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-white">camera_alt</span>
</div>
<!-- App Icon 2 -->
<div class="w-8 h-8 rounded-full border-2 border-white dark:border-[#1c2e22] bg-gradient-to-tr from-blue-500 to-cyan-500 overflow-hidden flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-white">chat_bubble</span>
</div>
<!-- App Icon 3 -->
<div class="w-8 h-8 rounded-full border-2 border-white dark:border-[#1c2e22] bg-slate-800 dark:bg-white/20 flex items-center justify-center">
<span class="text-[10px] font-bold text-white">+2</span>
</div>
</div>
<div class="flex flex-col items-start">
<span class="text-sm font-bold text-slate-900 dark:text-white">Applying to Socials</span>
<span class="text-xs text-slate-500 dark:text-gray-400">Instagram, TikTok +2 more</span>
</div>
</div>
<span class="material-symbols-outlined text-slate-400">chevron_right</span>
</button>
</div>
<!-- Strict Mode Section -->
<div class="flex flex-col gap-4">
<div class="flex items-center justify-between">
<h3 class="font-bold text-sm uppercase tracking-wider text-slate-500 dark:text-gray-400">Strict Mode Level</h3>
<button class="text-xs text-primary hover:underline">What's this?</button>
</div>
<div class="flex flex-col gap-3">
<!-- Option: Easy -->
<label class="cursor-pointer group relative flex items-center p-4 rounded-xl bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 hover:border-slate-300 dark:hover:border-white/20 transition-all">
<input class="peer sr-only" name="strict_mode" type="radio"/>
<div class="flex items-center justify-center w-10 h-10 rounded-lg bg-green-100 dark:bg-green-900/30 text-green-600 dark:text-green-400 mr-4">
<span class="material-symbols-outlined">coffee</span>
</div>
<div class="flex-1">
<div class="font-bold text-slate-900 dark:text-white">Easy</div>
<div class="text-xs text-slate-500 dark:text-gray-400">Allow short breaks after limit</div>
</div>
<div class="w-5 h-5 rounded-full border-2 border-slate-300 dark:border-white/20 peer-checked:border-primary peer-checked:bg-primary transition-colors flex items-center justify-center">
<div class="w-2 h-2 bg-background-dark rounded-full opacity-0 peer-checked:opacity-100"></div>
</div>
<!-- Selection Highlight Border -->
<div class="absolute inset-0 border-2 border-transparent peer-checked:border-primary rounded-xl pointer-events-none"></div>
</label>
<!-- Option: Medium -->
<label class="cursor-pointer group relative flex items-center p-4 rounded-xl bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 hover:border-slate-300 dark:hover:border-white/20 transition-all">
<input class="peer sr-only" name="strict_mode" type="radio"/>
<div class="flex items-center justify-center w-10 h-10 rounded-lg bg-yellow-100 dark:bg-yellow-900/30 text-yellow-600 dark:text-yellow-400 mr-4">
<span class="material-symbols-outlined">timer</span>
</div>
<div class="flex-1">
<div class="font-bold text-slate-900 dark:text-white">Medium</div>
<div class="text-xs text-slate-500 dark:text-gray-400">15s breathing delay on open</div>
</div>
<div class="w-5 h-5 rounded-full border-2 border-slate-300 dark:border-white/20 peer-checked:border-primary peer-checked:bg-primary transition-colors flex items-center justify-center">
<div class="w-2 h-2 bg-background-dark rounded-full opacity-0 peer-checked:opacity-100"></div>
</div>
<!-- Selection Highlight Border -->
<div class="absolute inset-0 border-2 border-transparent peer-checked:border-primary rounded-xl pointer-events-none"></div>
</label>
<!-- Option: Hard -->
<label class="cursor-pointer group relative flex items-center p-4 rounded-xl bg-white dark:bg-white/5 border border-slate-200 dark:border-white/10 hover:border-slate-300 dark:hover:border-white/20 transition-all">
<input checked="" class="peer sr-only" name="strict_mode" type="radio"/>
<div class="flex items-center justify-center w-10 h-10 rounded-lg bg-red-100 dark:bg-red-900/30 text-red-600 dark:text-red-400 mr-4">
<span class="material-symbols-outlined">lock</span>
</div>
<div class="flex-1">
<div class="font-bold text-slate-900 dark:text-white">Hard</div>
<div class="text-xs text-slate-500 dark:text-gray-400">Strict cutoff. No entry after limit.</div>
</div>
<div class="w-5 h-5 rounded-full border-2 border-slate-300 dark:border-white/20 peer-checked:border-primary peer-checked:bg-primary transition-colors flex items-center justify-center">
<div class="w-2 h-2 bg-background-dark rounded-full opacity-0 peer-checked:opacity-100"></div>
</div>
<!-- Selection Highlight Border & Glow -->
<div class="absolute inset-0 border-2 border-transparent peer-checked:border-primary rounded-xl pointer-events-none shadow-[0_0_20px_rgba(19,236,91,0.05)]"></div>
</label>
</div>
</div>
</main>
<!-- Fixed Footer -->
<div class="fixed bottom-0 left-0 w-full p-4 bg-gradient-to-t from-background-light via-background-light to-transparent dark:from-background-dark dark:via-background-dark dark:to-transparent pt-12">
<div class="max-w-md mx-auto">
<button class="w-full bg-primary hover:bg-[#0fd650] text-background-dark font-bold text-lg py-4 rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span>Create Block</span>
<span class="material-symbols-outlined text-[20px] font-bold">arrow_forward</span>
</button>
</div>
</div>
</body></html>
