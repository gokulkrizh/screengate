<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Block – Block Now</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding for cleaner UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white font-display antialiased h-screen flex flex-col overflow-hidden selection:bg-primary selection:text-black">
<!-- Top Navigation -->
<header class="flex items-center justify-between p-4 pt-6 pb-2 shrink-0">
<button class="text-white hover:text-primary transition-colors flex size-10 items-center justify-center rounded-full hover:bg-white/10">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<h1 class="text-white text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10">Block Now</h1>
</header>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col w-full max-w-md mx-auto px-4 overflow-y-auto no-scrollbar pb-24">
<!-- Timer Picker Section -->
<div class="mt-4 mb-8 relative">
<div class="text-center mb-6">
<p class="text-white/50 text-sm font-medium tracking-wide uppercase">Set Duration</p>
</div>
<!-- Wheel Picker Container -->
<div class="relative h-56 w-full flex justify-center items-center overflow-hidden touch-none select-none">
<!-- Central Selection Highlight -->
<div class="absolute w-full h-[60px] bg-[#1a3322] border border-[#284430] rounded-xl z-0 top-1/2 -translate-y-1/2 flex items-center justify-between px-6 pointer-events-none shadow-[0_0_20px_rgba(19,236,91,0.05)]">
<span class="text-xs font-bold text-primary opacity-50 ml-16">HR</span>
<span class="text-xs font-bold text-primary opacity-50 mr-16">MIN</span>
</div>
<!-- Gradients for fade effect -->
<div class="absolute top-0 left-0 w-full h-20 bg-gradient-to-b from-background-dark to-transparent z-20 pointer-events-none"></div>
<div class="absolute bottom-0 left-0 w-full h-20 bg-gradient-to-t from-background-dark to-transparent z-20 pointer-events-none"></div>
<!-- Columns -->
<div class="flex gap-4 w-full justify-center z-10 h-full">
<!-- Hours Column -->
<div class="w-1/3 text-center flex flex-col items-center justify-center space-y-4 py-20 snap-y snap-mandatory overflow-y-scroll no-scrollbar">
<div class="snap-center shrink-0 h-[60px] flex items-center justify-center"><span class="text-3xl font-bold text-white/20">23</span></div>
<div class="snap-center shrink-0 h-[60px] flex items-center justify-center"><span class="text-4xl font-bold text-white">00</span></div>
<div class="snap-center shrink-0 h-[60px] flex items-center justify-center"><span class="text-3xl font-bold text-white/20">01</span></div>
<div class="snap-center shrink-0 h-[60px] flex items-center justify-center"><span class="text-3xl font-bold text-white/20">02</span></div>
</div>
<div class="w-[1px] bg-white/5 h-32 self-center rounded-full"></div>
<!-- Minutes Column -->
<div class="w-1/3 text-center flex flex-col items-center justify-center space-y-4 py-20 snap-y snap-mandatory overflow-y-scroll no-scrollbar">
<div class="snap-center shrink-0 h-[60px] flex items-center justify-center"><span class="text-3xl font-bold text-white/20">15</span></div>
<div class="snap-center shrink-0 h-[60px] flex items-center justify-center"><span class="text-4xl font-bold text-white text-primary drop-shadow-[0_0_8px_rgba(19,236,91,0.4)]">20</span></div>
<div class="snap-center shrink-0 h-[60px] flex items-center justify-center"><span class="text-3xl font-bold text-white/20">25</span></div>
<div class="snap-center shrink-0 h-[60px] flex items-center justify-center"><span class="text-3xl font-bold text-white/20">30</span></div>
</div>
</div>
</div>
<!-- Quick Presets -->
<div class="flex gap-3 mt-6 justify-center">
<button class="group flex h-9 items-center justify-center rounded-full bg-[#1a3322] border border-white/5 hover:border-primary/50 hover:bg-[#203d29] active:scale-95 transition-all px-4">
<span class="text-white text-sm font-semibold group-hover:text-primary">10m</span>
</button>
<button class="group flex h-9 items-center justify-center rounded-full bg-[#1a3322] border border-primary/30 shadow-[0_0_10px_rgba(19,236,91,0.1)] hover:bg-[#203d29] active:scale-95 transition-all px-4">
<span class="text-primary text-sm font-bold">25m</span>
</button>
<button class="group flex h-9 items-center justify-center rounded-full bg-[#1a3322] border border-white/5 hover:border-primary/50 hover:bg-[#203d29] active:scale-95 transition-all px-4">
<span class="text-white text-sm font-semibold group-hover:text-primary">45m</span>
</button>
<button class="group flex h-9 items-center justify-center rounded-full bg-[#1a3322] border border-white/5 hover:border-primary/50 hover:bg-[#203d29] active:scale-95 transition-all px-4">
<span class="text-white text-sm font-semibold group-hover:text-primary">1h</span>
</button>
</div>
</div>
<div class="h-px w-full bg-gradient-to-r from-transparent via-white/10 to-transparent my-6"></div>
<!-- Strictness Section -->
<div class="w-full">
<h2 class="text-white text-lg font-bold mb-4 px-1">Select Strictness</h2>
<!-- Segmented Control -->
<div class="flex bg-[#1a3322] p-1.5 rounded-xl border border-white/5 relative">
<!-- Easy -->
<label class="cursor-pointer flex-1 relative z-10">
<input class="peer sr-only" name="strictness" type="radio" value="easy"/>
<div class="h-10 w-full flex items-center justify-center rounded-lg text-[#9db9a6] font-semibold text-sm transition-all peer-checked:text-white hover:bg-white/5 peer-checked:bg-transparent">
                        Easy
                    </div>
<!-- Active background pill (fake animation logic would go here in js, using static specific styling for now) -->
</label>
<!-- Medium (Selected) -->
<label class="cursor-pointer flex-1 relative z-10">
<input checked="" class="peer sr-only" name="strictness" type="radio" value="medium"/>
<div class="h-10 w-full flex items-center justify-center rounded-lg text-[#9db9a6] font-semibold text-sm transition-all peer-checked:text-black peer-checked:bg-primary peer-checked:shadow-lg peer-checked:shadow-primary/20">
                        Medium
                    </div>
</label>
<!-- Hard -->
<label class="cursor-pointer flex-1 relative z-10">
<input class="peer sr-only" name="strictness" type="radio" value="hard"/>
<div class="h-10 w-full flex items-center justify-center rounded-lg text-[#9db9a6] font-semibold text-sm transition-all peer-checked:text-white hover:bg-white/5">
                        Hard
                    </div>
</label>
</div>
<!-- Dynamic Description -->
<div class="mt-4 p-4 rounded-xl bg-white/5 border border-white/5 flex gap-3 items-start">
<span class="material-symbols-outlined text-primary text-xl mt-0.5">info</span>
<div>
<p class="text-sm text-white font-medium">Medium Strictness</p>
<p class="text-xs text-[#9db9a6] mt-1 leading-relaxed">
                        You can pause the session, but there is a <span class="text-white">15-second delay</span> before you can unlock your phone.
                    </p>
</div>
</div>
</div>
</main>
<!-- Bottom Action Button -->
<footer class="fixed bottom-0 left-0 w-full p-4 bg-gradient-to-t from-background-dark via-background-dark to-transparent pt-8">
<div class="max-w-md mx-auto">
<button class="relative w-full group overflow-hidden rounded-2xl bg-primary h-14 flex items-center justify-center shadow-[0_0_20px_rgba(19,236,91,0.3)] transition-transform active:scale-[0.98]">
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
<span class="relative text-background-dark font-extrabold text-lg tracking-wide flex items-center gap-2">
                    Start Focusing
                    <span class="material-symbols-outlined font-bold">play_arrow</span>
</span>
</button>
</div>
</footer>
</body></html>
