<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Focus Session - Running</title>
<!-- Google Fonts: Manrope -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS with Config -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                        "surface-dark": "#1a2e22",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                    boxShadow: {
                        "glow": "0 0 20px rgba(19, 236, 91, 0.3)",
                        "inner-glow": "inset 0 0 20px rgba(19, 236, 91, 0.1)"
                    }
                },
            },
        }
    </script>
<style>
        /* Custom styles for specific effects */
        .timer-glow {
            filter: drop-shadow(0 0 8px rgba(19, 236, 91, 0.4));
        }
        
        /* Simulating a breathing animation for the outer ring */
        @keyframes breathe {
            0%, 100% { opacity: 0.8; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.02); }
        }
        .animate-breathe {
            animation: breathe 4s ease-in-out infinite;
        }

        .glass-panel {
            background: rgba(26, 46, 34, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white overflow-hidden h-screen w-full flex flex-col selection:bg-primary selection:text-black">
<!-- Top App Bar -->
<div class="flex items-center w-full p-4 pt-12 pb-2 justify-between z-10 relative">
<button class="text-white/70 hover:text-white transition-colors flex size-12 shrink-0 items-center justify-center rounded-full active:bg-white/10">
<span class="material-symbols-outlined text-[28px]">keyboard_arrow_down</span>
</button>
<div class="flex flex-col items-center justify-center flex-1">
<h2 class="text-white text-base font-bold tracking-wide uppercase opacity-80">Focus Mode</h2>
<div class="flex items-center gap-1 text-primary text-xs font-semibold tracking-wider">
<span class="size-2 rounded-full bg-primary animate-pulse"></span>
                ACTIVE
            </div>
</div>
<button class="text-white/70 hover:text-white transition-colors flex size-12 shrink-0 items-center justify-center rounded-full active:bg-white/10">
<span class="material-symbols-outlined text-[24px]">tune</span>
</button>
</div>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col items-center justify-center w-full px-6 relative z-0">
<!-- Background Ambient Glow -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] bg-primary/5 rounded-full blur-[80px] pointer-events-none"></div>
<!-- Timer Section -->
<div class="relative flex items-center justify-center size-72 mb-8">
<!-- SVG Timer Ring -->
<svg class="w-full h-full -rotate-90 transform" viewbox="0 0 256 256">
<!-- Track -->
<circle class="text-white/5" cx="128" cy="128" fill="none" r="116" stroke="currentColor" stroke-width="6"></circle>
<!-- Progress Indicator (Simulated ~75% progress) -->
<circle class="text-primary timer-glow" cx="128" cy="128" fill="none" r="116" stroke="currentColor" stroke-dasharray="729" stroke-dashoffset="180" stroke-linecap="round" stroke-width="6"></circle>
<!-- Secondary decorative thin ring -->
<circle class="text-white/10 animate-breathe" cx="128" cy="128" fill="none" r="100" stroke="currentColor" stroke-dasharray="4 4" stroke-width="1"></circle>
</svg>
<!-- Digital Time Display -->
<div class="absolute inset-0 flex flex-col items-center justify-center text-center">
<h1 class="text-7xl font-bold tracking-tighter text-white drop-shadow-lg mb-1">24:59</h1>
<p class="text-primary/90 font-medium text-lg tracking-wide">Deep Work</p>
</div>
</div>
<!-- Meta Info -->
<div class="text-center space-y-2 mb-10">
<p class="text-white/50 text-sm font-medium">Expected completion: 4:30 PM</p>
<p class="text-white/80 text-sm italic">"Focus on being productive instead of busy."</p>
</div>
<!-- Blocked Apps Preview -->
<div class="w-full max-w-xs mb-8">
<div class="flex items-center justify-between mb-3 px-1">
<span class="text-xs font-bold text-white/60 uppercase tracking-wider">Restricted Apps</span>
<span class="text-xs font-bold text-primary">12 Active</span>
</div>
<div class="glass-panel rounded-xl p-3 flex items-center justify-between gap-2 overflow-hidden">
<!-- Mock App Icons (Greyed out) -->
<div class="size-10 rounded-lg bg-white/10 flex items-center justify-center text-white/30">
<span class="material-symbols-outlined text-[20px]">smart_display</span> <!-- Youtube-ish -->
</div>
<div class="size-10 rounded-lg bg-white/10 flex items-center justify-center text-white/30">
<span class="material-symbols-outlined text-[20px]">chat_bubble</span> <!-- Social -->
</div>
<div class="size-10 rounded-lg bg-white/10 flex items-center justify-center text-white/30">
<span class="material-symbols-outlined text-[20px]">photo_camera</span> <!-- Insta-ish -->
</div>
<div class="size-10 rounded-lg bg-white/10 flex items-center justify-center text-white/30">
<span class="material-symbols-outlined text-[20px]">mail</span> <!-- Mail -->
</div>
<div class="size-10 rounded-lg bg-white/5 border border-white/5 flex items-center justify-center text-white/20">
<span class="text-xs font-bold">+8</span>
</div>
</div>
</div>
</main>
<!-- Controls / Footer -->
<div class="w-full px-6 pb-10 flex flex-col gap-5 z-20">
<!-- Secondary Actions -->
<div class="grid grid-cols-2 gap-4">
<button class="group flex items-center justify-center gap-2 h-14 rounded-2xl bg-surface-dark border border-white/5 hover:bg-white/5 active:scale-95 transition-all">
<span class="material-symbols-outlined text-primary group-hover:scale-110 transition-transform">add_circle</span>
<span class="text-white font-bold text-sm">Add 5m</span>
</button>
<button class="group flex items-center justify-center gap-2 h-14 rounded-2xl bg-surface-dark border border-white/5 hover:bg-white/5 active:scale-95 transition-all">
<span class="material-symbols-outlined text-white/80 group-hover:text-white transition-colors">pause</span>
<span class="text-white font-bold text-sm">Pause</span>
</button>
</div>
<!-- Slide to Stop (Visual Mock) -->
<div class="relative w-full h-16 rounded-full bg-white/5 border border-white/10 flex items-center p-1 overflow-hidden">
<!-- Simulated background progress/hint -->
<div class="absolute inset-0 bg-gradient-to-r from-red-500/10 to-transparent opacity-0 hover:opacity-100 transition-opacity"></div>
<!-- Draggable Knob -->
<div class="relative z-10 size-14 bg-white rounded-full flex items-center justify-center shadow-[0_0_15px_rgba(255,255,255,0.3)] group cursor-pointer">
<span class="material-symbols-outlined text-black font-bold group-hover:translate-x-1 transition-transform">chevron_right</span>
</div>
<!-- Text Label -->
<div class="flex-1 text-center pr-14">
<span class="text-white/40 text-sm font-semibold tracking-widest uppercase animate-pulse">Slide to finish</span>
</div>
</div>
</div>
</body></html>
