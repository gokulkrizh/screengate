<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Screendiet Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                        "surface-dark": "#1A2C20", // Slightly lighter for cards
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hiding for clean UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-slate-900 dark:text-white pb-24 selection:bg-primary selection:text-black">
<div class="relative flex min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto shadow-2xl bg-background-light dark:bg-background-dark">
<!-- Top App Bar -->
<header class="sticky top-0 z-10 flex items-center justify-center px-4 py-4 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md border-b border-gray-200 dark:border-white/5">
<h1 class="text-xl font-extrabold tracking-tight">Settings</h1>
</header>
<!-- Main Content -->
<main class="flex-1 px-4 py-6 space-y-8">
<!-- Section 1: User & Plan -->
<section>
<h3 class="text-sm font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-3 px-1">User &amp; Plan</h3>
<div class="flex flex-col overflow-hidden rounded-2xl bg-white dark:bg-surface-dark shadow-sm">
<!-- Account Item -->
<button class="group flex items-center justify-between p-4 active:bg-gray-50 dark:active:bg-white/5 transition-colors w-full border-b border-gray-100 dark:border-white/5">
<div class="flex items-center gap-4">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-primary/10 dark:bg-primary/20 text-primary">
<span class="material-symbols-outlined text-[24px]">person</span>
</div>
<div class="flex flex-col items-start text-left">
<span class="text-base font-semibold text-slate-900 dark:text-white">Account</span>
<span class="text-xs text-gray-500 dark:text-gray-400">Manage profile details</span>
</div>
</div>
<span class="material-symbols-outlined text-gray-400 text-[20px]">chevron_right</span>
</button>
<!-- Subscription Item -->
<button class="group flex items-center justify-between p-4 active:bg-gray-50 dark:active:bg-white/5 transition-colors w-full">
<div class="flex items-center gap-4">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-primary/10 dark:bg-primary/20 text-primary">
<span class="material-symbols-outlined text-[24px]">verified</span>
</div>
<div class="flex flex-col items-start text-left">
<span class="text-base font-semibold text-slate-900 dark:text-white">Subscription</span>
</div>
</div>
<div class="flex items-center gap-2">
<span class="text-sm font-medium text-primary">Pro Active</span>
<span class="material-symbols-outlined text-gray-400 text-[20px]">chevron_right</span>
</div>
</button>
</div>
</section>
<!-- Section 2: Focus Configuration -->
<section>
<h3 class="text-sm font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-3 px-1">Focus Configuration</h3>
<div class="flex flex-col overflow-hidden rounded-2xl bg-white dark:bg-surface-dark shadow-sm">
<!-- Block Behavior -->
<button class="group flex items-center justify-between p-4 active:bg-gray-50 dark:active:bg-white/5 transition-colors w-full border-b border-gray-100 dark:border-white/5">
<div class="flex items-center gap-4">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-primary/10 dark:bg-primary/20 text-primary">
<span class="material-symbols-outlined text-[24px]">shield</span>
</div>
<span class="text-base font-semibold text-slate-900 dark:text-white">Block Behavior</span>
</div>
<span class="material-symbols-outlined text-gray-400 text-[20px]">chevron_right</span>
</button>
<!-- Notifications -->
<button class="group flex items-center justify-between p-4 active:bg-gray-50 dark:active:bg-white/5 transition-colors w-full border-b border-gray-100 dark:border-white/5">
<div class="flex items-center gap-4">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-primary/10 dark:bg-primary/20 text-primary">
<span class="material-symbols-outlined text-[24px]">notifications</span>
</div>
<span class="text-base font-semibold text-slate-900 dark:text-white">Notifications</span>
</div>
<span class="material-symbols-outlined text-gray-400 text-[20px]">chevron_right</span>
</button>
<!-- Preferences -->
<button class="group flex items-center justify-between p-4 active:bg-gray-50 dark:active:bg-white/5 transition-colors w-full">
<div class="flex items-center gap-4">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-primary/10 dark:bg-primary/20 text-primary">
<span class="material-symbols-outlined text-[24px]">tune</span>
</div>
<span class="text-base font-semibold text-slate-900 dark:text-white">Preferences</span>
</div>
<span class="material-symbols-outlined text-gray-400 text-[20px]">chevron_right</span>
</button>
</div>
</section>
<!-- Section 3: Legal & Support -->
<section>
<h3 class="text-sm font-semibold uppercase tracking-wider text-gray-500 dark:text-gray-400 mb-3 px-1">Legal &amp; Support</h3>
<div class="flex flex-col overflow-hidden rounded-2xl bg-white dark:bg-surface-dark shadow-sm">
<!-- Data & Privacy -->
<button class="group flex items-center justify-between p-4 active:bg-gray-50 dark:active:bg-white/5 transition-colors w-full border-b border-gray-100 dark:border-white/5">
<div class="flex items-center gap-4">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-primary/10 dark:bg-primary/20 text-primary">
<span class="material-symbols-outlined text-[24px]">lock</span>
</div>
<span class="text-base font-semibold text-slate-900 dark:text-white">Data &amp; Privacy</span>
</div>
<span class="material-symbols-outlined text-gray-400 text-[20px]">chevron_right</span>
</button>
<!-- Help & Support -->
<button class="group flex items-center justify-between p-4 active:bg-gray-50 dark:active:bg-white/5 transition-colors w-full border-b border-gray-100 dark:border-white/5">
<div class="flex items-center gap-4">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-primary/10 dark:bg-primary/20 text-primary">
<span class="material-symbols-outlined text-[24px]">help</span>
</div>
<span class="text-base font-semibold text-slate-900 dark:text-white">Help &amp; Support</span>
</div>
<span class="material-symbols-outlined text-gray-400 text-[20px]">chevron_right</span>
</button>
<!-- Logout -->
<button class="group flex items-center justify-between p-4 active:bg-gray-50 dark:active:bg-white/5 transition-colors w-full">
<div class="flex items-center gap-4">
<div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-red-500/10 text-red-500">
<span class="material-symbols-outlined text-[24px]">logout</span>
</div>
<span class="text-base font-semibold text-red-500">Log Out</span>
</div>
</button>
</div>
</section>
<!-- Footer -->
<div class="flex flex-col items-center justify-center pt-4 pb-8">
<p class="text-xs text-gray-500 dark:text-gray-600 font-medium">Screendiet v1.0.2</p>
</div>
</main>
<!-- Bottom Navigation Bar -->
<nav class="fixed bottom-0 left-0 right-0 z-50 mx-auto max-w-md bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-lg border-t border-gray-200 dark:border-white/5 pb-6 pt-2">

</button>
<button class="flex flex-col items-center gap-1 p-2 w-16 group">
<span class="material-symbols-outlined text-gray-400 group-hover:text-primary transition-colors">timer</span>
<span class="text-[10px] font-medium text-gray-400 group-hover:text-primary transition-colors">Focus</span>
</button>
<button class="flex flex-col items-center gap-1 p-2 w-16 group">
<span class="material-symbols-outlined text-gray-400 group-hover:text-primary transition-colors">bar_chart</span>
<span class="text-[10px] font-medium text-gray-400 group-hover:text-primary transition-colors">Reports</span>
</button>
<button class="flex flex-col items-center gap-1 p-2 w-16 group">
<span class="material-symbols-outlined text-primary fill-1">settings</span>
<span class="text-[10px] font-bold text-primary">Settings</span>
</button>
</div>
</nav>
</div>
