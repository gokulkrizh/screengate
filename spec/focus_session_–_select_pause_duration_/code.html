<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Focus Session - Pause</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "2xl": "1rem", "3xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        /* Custom scrollbar hide for clean mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-black h-screen w-full relative overflow-hidden">
<!-- Background Simulation (The active session behind the modal) -->
<div class="absolute inset-0 z-0 flex flex-col items-center justify-center opacity-40 blur-sm bg-[url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&amp;w=2070&amp;auto=format&amp;fit=crop')] bg-cover bg-center" data-alt="Abstract dark blurred background representing focus mode">
<div class="h-64 w-64 rounded-full border-4 border-primary/30 flex items-center justify-center">
<span class="text-6xl font-bold text-white">24:00</span>
</div>
</div>
<!-- Modal Overlay -->
<div class="relative z-10 flex h-full w-full flex-col justify-end bg-black/40 backdrop-blur-[2px]">
<!-- Bottom Sheet Container -->
<div class="w-full bg-background-light dark:bg-background-dark rounded-t-[32px] shadow-[0_-8px_30px_rgba(0,0,0,0.5)] flex flex-col max-h-[90vh] transition-transform duration-300">
<!-- Handle -->
<div class="flex flex-col items-center pt-3 pb-2 w-full cursor-grab active:cursor-grabbing">
<div class="h-1.5 w-12 rounded-full bg-neutral-300 dark:bg-neutral-700/50"></div>
</div>
<!-- Header -->
<div class="flex items-center justify-between px-6 py-2">
<div class="w-10"></div> <!-- Spacer for center alignment -->
<h2 class="text-neutral-900 dark:text-white text-lg font-bold tracking-tight">Pause Session</h2>
<button class="w-10 h-10 flex items-center justify-end text-neutral-500 dark:text-neutral-400 hover:text-neutral-900 dark:hover:text-white transition-colors">
<span class="material-symbols-outlined text-3xl">close</span>
</button>
</div>
<!-- Content Body -->
<div class="px-6 pt-2 pb-8 overflow-y-auto no-scrollbar">
<!-- Hero Icon & Text -->
<div class="flex flex-col items-center justify-center text-center mb-8 mt-2">
<div class="w-16 h-16 rounded-full bg-primary/10 flex items-center justify-center mb-4 text-primary animate-pulse">
<span class="material-symbols-outlined text-[32px] filled">hot_tub</span>
</div>
<h1 class="text-neutral-900 dark:text-white text-[28px] font-extrabold leading-tight mb-2">Take a breather</h1>
<p class="text-neutral-500 dark:text-neutral-400 text-base font-medium">How long would you like to step away?</p>
</div>
<!-- Duration Selection Grid -->
<div class="grid grid-cols-2 gap-4 mb-6">
<!-- Option 1: 5m -->
<label class="group relative cursor-pointer">
<input class="peer sr-only" name="duration" type="radio" value="5m"/>
<div class="flex flex-col items-center justify-center h-24 rounded-2xl bg-white dark:bg-[#1c2a21] border border-transparent peer-checked:border-primary peer-checked:bg-primary/5 dark:peer-checked:bg-primary/10 transition-all duration-200 shadow-sm">
<span class="text-2xl font-extrabold text-neutral-800 dark:text-white peer-checked:text-primary mb-0.5 group-hover:scale-110 transition-transform">5</span>
<span class="text-sm font-medium text-neutral-500 dark:text-neutral-400 peer-checked:text-primary/80">min</span>
</div>
<!-- Checkmark Indicator (Visible only when checked) -->
<div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 transition-opacity text-primary">
<span class="material-symbols-outlined text-xl">check_circle</span>
</div>
</label>
<!-- Option 2: 10m -->
<label class="group relative cursor-pointer">
<input class="peer sr-only" name="duration" type="radio" value="10m"/>
<div class="flex flex-col items-center justify-center h-24 rounded-2xl bg-white dark:bg-[#1c2a21] border border-transparent peer-checked:border-primary peer-checked:bg-primary/5 dark:peer-checked:bg-primary/10 transition-all duration-200 shadow-sm">
<span class="text-2xl font-extrabold text-neutral-800 dark:text-white peer-checked:text-primary mb-0.5 group-hover:scale-110 transition-transform">10</span>
<span class="text-sm font-medium text-neutral-500 dark:text-neutral-400 peer-checked:text-primary/80">min</span>
</div>
<div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 transition-opacity text-primary">
<span class="material-symbols-outlined text-xl">check_circle</span>
</div>
</label>
<!-- Option 3: 15m (Pre-selected) -->
<label class="group relative cursor-pointer">
<input checked="" class="peer sr-only" name="duration" type="radio" value="15m"/>
<div class="flex flex-col items-center justify-center h-24 rounded-2xl bg-white dark:bg-[#1c2a21] border border-transparent peer-checked:border-primary peer-checked:bg-primary/5 dark:peer-checked:bg-primary/10 transition-all duration-200 shadow-sm">
<span class="text-2xl font-extrabold text-neutral-800 dark:text-white peer-checked:text-primary mb-0.5 group-hover:scale-110 transition-transform">15</span>
<span class="text-sm font-medium text-neutral-500 dark:text-neutral-400 peer-checked:text-primary/80">min</span>
</div>
<div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 transition-opacity text-primary">
<span class="material-symbols-outlined text-xl">check_circle</span>
</div>
</label>
<!-- Option 4: 30m -->
<label class="group relative cursor-pointer">
<input class="peer sr-only" name="duration" type="radio" value="30m"/>
<div class="flex flex-col items-center justify-center h-24 rounded-2xl bg-white dark:bg-[#1c2a21] border border-transparent peer-checked:border-primary peer-checked:bg-primary/5 dark:peer-checked:bg-primary/10 transition-all duration-200 shadow-sm">
<span class="text-2xl font-extrabold text-neutral-800 dark:text-white peer-checked:text-primary mb-0.5 group-hover:scale-110 transition-transform">30</span>
<span class="text-sm font-medium text-neutral-500 dark:text-neutral-400 peer-checked:text-primary/80">min</span>
</div>
<div class="absolute top-2 right-2 opacity-0 peer-checked:opacity-100 transition-opacity text-primary">
<span class="material-symbols-outlined text-xl">check_circle</span>
</div>
</label>
</div>
<!-- Custom Input Trigger -->
<div class="flex justify-center mb-8">
<button class="flex items-center gap-2 px-4 py-2 rounded-full text-sm font-semibold text-neutral-500 dark:text-neutral-400 hover:text-primary dark:hover:text-primary hover:bg-neutral-100 dark:hover:bg-[#1c2a21] transition-colors">
<span class="material-symbols-outlined text-xl">edit_note</span>
                        Set custom duration
                    </button>
</div>
<!-- Main Action Button -->
<button class="w-full h-14 rounded-xl bg-primary hover:bg-green-400 text-background-dark font-bold text-lg tracking-wide shadow-lg shadow-primary/20 flex items-center justify-center gap-2 transform active:scale-[0.98] transition-all">
<span class="material-symbols-outlined font-bold">play_arrow</span>
                    Start Break
                </button>
</div>
<!-- Bottom Spacer for Home Indicator on iOS -->
<div class="h-6 w-full"></div>
</div>
</div>
</body></html>
