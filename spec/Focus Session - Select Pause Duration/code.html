<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Screendiet - Set Custom Duration</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .time-picker-column {
            mask-image: linear-gradient(to bottom, transparent, black 40%, black 60%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 40%, black 60%, transparent);
        }
    </style>
<style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-display bg-black h-screen w-full relative overflow-hidden">
<div class="absolute inset-0 z-0 flex flex-col items-center justify-center opacity-30 blur-md bg-[url('https://images.unsplash.com/photo-1550684848-fac1c5b4e853?q=80&amp;w=2070&amp;auto=format&amp;fit=crop')] bg-cover bg-center">
<div class="h-64 w-64 rounded-full border-4 border-primary/20 flex items-center justify-center">
<span class="text-6xl font-bold text-white/50">24:00</span>
</div>
</div>
<div class="relative z-10 flex h-full w-full flex-col justify-end bg-black/60 backdrop-blur-sm">
<div class="w-full bg-background-light dark:bg-background-dark rounded-t-[32px] shadow-[0_-8px_40px_rgba(0,0,0,0.7)] flex flex-col max-h-[90vh]">
<div class="flex flex-col items-center pt-3 pb-2 w-full">
<div class="h-1.5 w-12 rounded-full bg-neutral-300 dark:bg-neutral-800"></div>
</div>
<div class="flex items-center justify-between px-6 py-2">
<button class="w-10 h-10 flex items-center justify-start text-neutral-500 dark:text-neutral-400">
<span class="material-symbols-outlined text-2xl">arrow_back_ios</span>
</button>
<h2 class="text-neutral-900 dark:text-white text-lg font-bold tracking-tight">Set custom duration</h2>
<button class="w-10 h-10 flex items-center justify-end text-neutral-500 dark:text-neutral-400">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
</div>
<div class="px-8 pt-6 pb-8 overflow-y-auto no-scrollbar flex flex-col items-center">
<div class="relative w-full max-w-xs aspect-square flex items-center justify-center my-8">
<div class="absolute inset-x-0 h-16 bg-primary/10 dark:bg-primary/5 border-y border-primary/20 pointer-events-none rounded-lg"></div>
<div class="flex items-center justify-center gap-8 w-full h-full text-center">
<div class="time-picker-column flex flex-col items-center overflow-hidden h-full py-12">
<div class="space-y-4 py-8">
<div class="text-2xl font-medium text-neutral-300 dark:text-neutral-600 opacity-40">08</div>
<div class="text-3xl font-semibold text-neutral-400 dark:text-neutral-500 opacity-60">09</div>
<div class="text-5xl font-extrabold text-primary scale-110">10</div>
<div class="text-3xl font-semibold text-neutral-400 dark:text-neutral-500 opacity-60">11</div>
<div class="text-2xl font-medium text-neutral-300 dark:text-neutral-600 opacity-40">12</div>
</div>
<span class="text-xs font-bold uppercase tracking-widest text-primary/60 mt-2">min</span>
</div>
<div class="text-4xl font-bold text-neutral-300 dark:text-neutral-700 pb-6">:</div>
<div class="time-picker-column flex flex-col items-center overflow-hidden h-full py-12">
<div class="space-y-4 py-8">
<div class="text-2xl font-medium text-neutral-300 dark:text-neutral-600 opacity-40">28</div>
<div class="text-3xl font-semibold text-neutral-400 dark:text-neutral-500 opacity-60">29</div>
<div class="text-5xl font-extrabold text-primary scale-110">30</div>
<div class="text-3xl font-semibold text-neutral-400 dark:text-neutral-500 opacity-60">31</div>
<div class="text-2xl font-medium text-neutral-300 dark:text-neutral-600 opacity-40">32</div>
</div>
<span class="text-xs font-bold uppercase tracking-widest text-primary/60 mt-2">sec</span>
</div>
</div>
</div>
<div class="text-center mb-10">
<p class="text-neutral-500 dark:text-neutral-400 text-sm font-medium px-4">
                        Custom breaks allow you to fine-tune your focus cycles.
                    </p>
</div>
<div class="w-full space-y-3">
<button class="w-full h-14 rounded-2xl bg-primary hover:bg-green-400 text-background-dark font-extrabold text-lg tracking-tight shadow-lg shadow-primary/20 flex items-center justify-center gap-2 transform active:scale-[0.98] transition-all">
                        Set Duration
                    </button>
<button class="w-full h-12 rounded-xl text-neutral-500 dark:text-neutral-400 font-bold text-base hover:text-neutral-900 dark:hover:text-white transition-colors">
                        Cancel
                    </button>
</div>
</div>
<div class="h-8 w-full"></div>
</div>
</div>

</body></html>
