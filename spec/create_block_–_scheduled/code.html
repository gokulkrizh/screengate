<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Block – Scheduled</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13ec5b",
                        "background-light": "#f6f8f6",
                        "background-dark": "#102216", // Deep dark green/black
                        "surface-dark": "#18281e", // Slightly lighter for cards
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        /* Custom scrollbar hiding for clean UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col items-center justify-center">
<!-- Mobile Container -->
<div class="relative flex h-full min-h-screen w-full max-w-md flex-col overflow-hidden bg-background-light dark:bg-background-dark shadow-2xl">
<!-- Header -->
<div class="flex items-center px-4 py-3 pb-2 pt-6 bg-background-light dark:bg-background-dark sticky top-0 z-10">
<button class="text-gray-900 dark:text-white flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-gray-200 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-[24px]">arrow_back_ios_new</span>
</button>
<h2 class="text-gray-900 dark:text-white text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10">Create Schedule</h2>
</div>
<!-- Main Scrollable Content -->
<div class="flex-1 overflow-y-auto no-scrollbar pb-24 px-5">
<!-- Section: Time Selection -->
<div class="mt-6 mb-8">
<h3 class="text-gray-900 dark:text-white text-lg font-bold leading-tight mb-4">Focus Duration</h3>
<div class="flex flex-col gap-4">
<!-- Start Time -->
<div class="flex items-center justify-between p-4 bg-white dark:bg-surface-dark rounded-xl border border-gray-200 dark:border-white/5 shadow-sm">
<div class="flex items-center gap-3">
<div class="size-10 rounded-full bg-primary/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined">wb_sunny</span>
</div>
<div class="flex flex-col">
<span class="text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Start Time</span>
<span class="text-gray-900 dark:text-white text-xl font-bold">09:00 AM</span>
</div>
</div>
<span class="material-symbols-outlined text-gray-400">expand_more</span>
</div>
<!-- Connector Line (Visual Flair) -->
<div class="mx-auto w-0.5 h-4 bg-gray-300 dark:bg-white/10 rounded-full"></div>
<!-- End Time -->
<div class="flex items-center justify-between p-4 bg-white dark:bg-surface-dark rounded-xl border border-gray-200 dark:border-white/5 shadow-sm">
<div class="flex items-center gap-3">
<div class="size-10 rounded-full bg-indigo-500/20 flex items-center justify-center text-indigo-400">
<span class="material-symbols-outlined">bedtime</span>
</div>
<div class="flex flex-col">
<span class="text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">End Time</span>
<span class="text-gray-900 dark:text-white text-xl font-bold">05:00 PM</span>
</div>
</div>
<span class="material-symbols-outlined text-gray-400">expand_more</span>
</div>
</div>
</div>
<!-- Section: Repeat Days -->
<div class="mb-8">
<h3 class="text-gray-900 dark:text-white text-lg font-bold leading-tight mb-4">Repeat On</h3>
<div class="flex justify-between items-center">
<!-- Day Toggles -->
<button class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold transition-all bg-primary text-background-dark shadow-[0_0_15px_rgba(19,236,91,0.4)]">M</button>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold transition-all bg-primary text-background-dark shadow-[0_0_15px_rgba(19,236,91,0.4)]">T</button>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold transition-all bg-primary text-background-dark shadow-[0_0_15px_rgba(19,236,91,0.4)]">W</button>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold transition-all bg-primary text-background-dark shadow-[0_0_15px_rgba(19,236,91,0.4)]">T</button>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold transition-all bg-primary text-background-dark shadow-[0_0_15px_rgba(19,236,91,0.4)]">F</button>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold transition-all bg-white dark:bg-white/10 text-gray-400 dark:text-gray-500 hover:bg-gray-200 dark:hover:bg-white/20">S</button>
<button class="w-10 h-10 rounded-full flex items-center justify-center text-sm font-bold transition-all bg-white dark:bg-white/10 text-gray-400 dark:text-gray-500 hover:bg-gray-200 dark:hover:bg-white/20">S</button>
</div>
</div>
<!-- Section: Strict Mode -->
<div class="mb-8">
<div class="flex items-center justify-between mb-4">
<h3 class="text-gray-900 dark:text-white text-lg font-bold leading-tight">Strict Mode</h3>
<span class="text-xs font-semibold px-2 py-1 rounded bg-yellow-500/20 text-yellow-500">Medium</span>
</div>
<!-- Custom Segmented Control -->
<div class="p-1 bg-gray-200 dark:bg-black/40 rounded-xl flex items-center relative mb-4">
<button class="flex-1 py-2.5 text-sm font-medium text-gray-500 dark:text-gray-400 rounded-lg relative z-10 transition-colors hover:text-gray-900 dark:hover:text-white">Easy</button>
<button class="flex-1 py-2.5 text-sm font-bold text-background-dark bg-primary rounded-lg shadow-sm relative z-10">Medium</button>
<button class="flex-1 py-2.5 text-sm font-medium text-gray-500 dark:text-gray-400 rounded-lg relative z-10 transition-colors hover:text-gray-900 dark:hover:text-white">Hard</button>
</div>
<!-- Mode Description Card -->
<div class="p-4 bg-white dark:bg-surface-dark rounded-xl border border-gray-200 dark:border-white/5 flex gap-4 items-start">
<span class="material-symbols-outlined text-primary mt-0.5">info</span>
<div>
<p class="text-gray-900 dark:text-white text-sm font-semibold mb-1">Medium Intensity</p>
<p class="text-gray-500 dark:text-gray-400 text-xs leading-relaxed">
                            You can take a <strong>5 minute break</strong> for every hour of focus. Apps will be blocked outside of breaks.
                        </p>
</div>
</div>
</div>
</div>
<!-- Fixed Bottom Action Area -->
<div class="absolute bottom-0 left-0 right-0 p-5 bg-gradient-to-t from-background-light via-background-light to-transparent dark:from-background-dark dark:via-background-dark dark:to-transparent pt-10">
<button class="w-full bg-primary hover:bg-primary/90 active:scale-[0.98] transition-all h-14 rounded-xl flex items-center justify-center gap-2 group shadow-[0_0_20px_rgba(19,236,91,0.25)]">
<span class="text-background-dark text-lg font-bold tracking-tight">Activate Schedule</span>
<span class="material-symbols-outlined text-background-dark group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</div>
</body></html>
